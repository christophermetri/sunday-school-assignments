<head>
<meta charset="utf-8">

<title>Advent to Lent Bible</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* VOICE: quiet, devotional, encouraging; a daily companion, not a dashboard.
   IDEA: an illuminated lectionary with a bookshelf that fills as each book is finished.
   PICTURE: today's reading card under a crimson band, then 73 book spines filling with gold.
   COLOUR and TYPE: Coptic crimson field, gold for finished, lapis for deuterocanon; Alegreya + Alegreya Sans.
   LAYOUT: phone-first single column, bottom tab bar; widens to 720px max. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#130d0f);--ink:light-dark(#1d1416,#f2eae6);--mute:light-dark(#6b5a5d,#b6a5a2);
--band:light-dark(#7a1828,#3c0f19);--bandink:#fbf1ea;--gold:light-dark(#a87a1f,#dcb257);--goldsoft:light-dark(#f4ead2,#3a2e16);
--lapis:light-dark(#24427c,#8aa7e3);--ot:light-dark(#7a1828,#d4566b);--line:light-dark(#eadfdc,#33272a);--card:light-dark(#fbf7f6,#1c1417);--red:light-dark(#b3261e,#ff8a80);--ok:light-dark(#2f6b3a,#8fd19b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Alegreya Sans",system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:Alegreya,Georgia,serif;line-height:1.1;text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
.band{background:var(--band);color:var(--bandink);padding:calc(14px + env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) 18px max(18px,env(safe-area-inset-left))}
.wrap{max-width:720px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-size:15px;opacity:.92}
.brand svg{width:22px;height:22px;flex:none}
.prog{margin-top:14px;display:flex;align-items:center;gap:14px}
.bar{flex:1;height:10px;border-radius:6px;background:rgb(255 255 255/.18);overflow:hidden}
.bar i{display:block;height:100%;background:#e6c06a;border-radius:6px;transition:width .5s}
.prog b{font-size:15px;white-space:nowrap}
.stat{font-size:15px;margin-top:8px;opacity:.95}
main{padding:18px max(16px,env(safe-area-inset-left)) 24px}
.view{display:none}.view.on{display:block}
.dayhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.dayhead h1{font-size:32px;flex:1}
.nav{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;flex:none}
.nav:disabled{opacity:.35}
.sub{color:var(--mute);font-size:15px;margin:0 0 14px}
.chip{display:inline-block;font-size:14px;padding:3px 10px;border-radius:20px;background:var(--goldsoft);color:var(--ink);margin-right:6px}
.chip.warn{background:light-dark(#fde7e4,#3d1715);color:var(--red)}
.chip.ok{background:light-dark(#e3f1e5,#173020);color:var(--ok)}
.grp{margin:18px 0 6px;font-size:14px;color:var(--mute);font-weight:700}
.grp.feast{color:var(--band)}:root[data-theme=dark] .grp.feast{color:var(--gold)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .grp.feast{color:var(--gold)}}
.row{display:flex;align-items:center;gap:14px;padding:12px 14px;min-height:60px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:var(--card);cursor:pointer;-webkit-tap-highlight-color:transparent}
.row input{appearance:none;-webkit-appearance:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--mute);flex:none;margin:0;display:grid;place-items:center;cursor:pointer;background:var(--bg)}
.row input:checked{background:var(--gold);border-color:var(--gold)}
.row input:checked::after{content:"";width:8px;height:14px;border:solid #fff;border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg)}
.row input:indeterminate::after{content:"";width:12px;height:3px;background:var(--mute);border-radius:2px}
.row input:focus-visible{outline:3px solid var(--lapis);outline-offset:2px}
.row .t{font-weight:700;font-size:18px;display:block}
.row .m{font-size:14px;color:var(--mute)}
.row.done .t{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--gold)}
details.intro{border-left:3px solid var(--gold);padding:8px 0 8px 14px;margin:14px 0}
details.intro summary{cursor:pointer;font-family:Alegreya,serif;font-weight:700;font-size:18px;list-style:none;min-height:30px}
details.intro summary::-webkit-details-marker{display:none}
details.intro summary small{font-family:"Alegreya Sans";font-weight:500;color:var(--gold);font-size:14px;margin-left:6px}
details.intro p{margin:6px 0 0;font-size:16px}
.feastnote{background:var(--goldsoft);border-radius:14px;padding:12px 14px;margin:10px 0;font-size:16px}
.feastnote b{font-family:Alegreya,serif;font-size:18px}
textarea{width:100%;min-height:96px;font:16px/1.5 "Alegreya Sans",sans-serif;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}
textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--lapis);outline-offset:2px}
.btn{min-height:44px;padding:10px 18px;border-radius:22px;border:0;background:var(--band);color:var(--bandink);font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.alert{border:1px solid var(--line);border-radius:14px;padding:14px;margin:6px 0 16px;background:var(--card)}
.alert p{margin:0 0 10px}
.plist{list-style:none;margin:0;padding:0}
.plist h3{font-size:22px;margin:22px 0 8px}
.pday{display:grid;grid-template-columns:62px minmax(0,1fr) 14px;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 4px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer;min-height:56px}
.pday .d{font-size:14px;color:var(--mute);line-height:1.2}.pday .d b{display:block;color:var(--ink);font-size:16px}
.pday .s{font-size:15px;line-height:1.35}
.pday .s em{font-style:normal;color:var(--band);font-weight:700}
.pday.today{background:var(--goldsoft);border-radius:10px}
.dot{width:12px;height:12px;border-radius:6px;border:2px solid var(--line)}
.dot.full{background:var(--gold);border-color:var(--gold)}.dot.part{border-color:var(--gold);background:linear-gradient(90deg,var(--gold) 50%,transparent 50%)}.dot.late{border-color:var(--red)}
.shelf{display:flex;flex-wrap:wrap;align-items:flex-end;gap:3px;padding:12px 10px 0;border-bottom:8px solid light-dark(#8a6a3a,#5a4524);margin-bottom:18px}
.spine{width:24px;border-radius:3px 3px 0 0;border:1px solid var(--c);background:linear-gradient(to top,var(--c) var(--p),transparent var(--p));cursor:pointer;padding:0;display:flex;align-items:flex-start;justify-content:center;overflow:hidden}
.spine span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;padding:4px 0;white-space:nowrap;color:var(--ink);font-weight:500}
.spine.full span{color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:14px;color:var(--mute);margin:4px 0 10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.ms{list-style:none;padding:0;margin:0}
.ms li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:16px}
.ms li svg{flex:none;width:22px;height:22px}
.ms li.no{color:var(--mute)}
.jent{border-bottom:1px solid var(--line);padding:12px 0}
.jent .d{font-size:14px;color:var(--mute)}
.jent p{margin:4px 0 0;white-space:pre-wrap}
.empty{color:var(--mute);padding:20px 0}
.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;min-height:56px;font-size:13px;color:var(--mute);text-decoration:none}
.tabs a svg{width:24px;height:24px}
.tabs a.on{color:var(--band);font-weight:700}
:root[data-theme=dark] .tabs a.on{color:var(--gold)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .tabs a.on{color:var(--gold)}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:22px;font-size:15px;transition:.3s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgb(0 0 0/.45);display:none;place-items:center;padding:20px;z-index:10}
.modal.on{display:grid}
.modal .box{background:var(--bg);border-radius:18px;padding:22px;max-width:420px;width:100%}
.modal h2{font-size:26px;margin-bottom:8px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.celebrate h2{color:var(--gold)}
.foot{font-size:13px;color:var(--mute);margin-top:28px}
.tips p{margin:6px 0}
h2.sec{font-size:26px;margin:4px 0 6px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function schedule(from,main,ps,pr,anc){
  const D=ND-from,days=Array.from({length:D},(_,k)=>({i:from+k,an:[],feast:[],main:[],ps:[],pr:[]}));
  if(D<=0)return [];
  ps.forEach((id,j)=>days[Math.min(D-1,Math.floor((j+0.5)*D/ps.length))].ps.push(id));
  days.forEach((x,d)=>{const k=x.ps.indexOf('PSA.119');if(k<0||x.ps.length<2)return;
    const bef=x.ps.slice(0,k),aft=x.ps.slice(k+1);x.ps=['PSA.119'];
    if(d>0)days[d-1].ps.push(...bef);else x.ps.unshift(...bef);
    if(d<D-1)days[d+1].ps.unshift(...aft);else x.ps.push(...aft)});
  pr.forEach((id,j)=>days[Math.min(D-1,Math.floor((j+0.5)*D/pr.length))].pr.push(id));
  anc.forEach(a=>{const d=toIdx(a.d)-from;if(d>=0&&d<D){days[d].an.push(...a.ids);days[d].feast.push(a)}});
  const vs=a=>a.reduce((s,id)=>s+V(id),0);
  const fixed=days.map(x=>vs(x.an)+vs(x.ps)+vs(x.pr)),total=fixed.reduce((a,b)=>a+b,0)+vs(main);
  let cum=0,p=0;
  days.forEach((x,d)=>{cum+=fixed[d];const T=total*(d+1)/D;
    while(p<main.length&&(d===D-1||cum+V(main[p])/2<=T)){x.main.push(main[p]);cum+=V(main[p]);p++}});
  return days;
}

  if(viewDay===t&&st.late>0)h+=`<div class="alert"><p><span class="chip warn">${st.late} chapters behind</span> About ${st.lateDays} day${st.lateDays>1?'s':''} of reading. Catch up when you can, or spread what's left evenly over the remaining days.</p><button class="btn" data-act="respread">Re-spread the rest</button></div>`;
  x.feast.forEach(a=>{h+=`<div class="feastnote"><b>${esc(a.label)}</b><br>${esc(a.note)}</div>`;h+=ranges(a.ids).map(r=>rowHTML(r)).join('')});
  if(x.an.length&&!x.feast.length)h+=`<div class="grp feast">Set-aside feast readings</div>`+ranges(x.an).map(r=>rowHTML(r)).join('');
  if(x.main.length){h+=`<div class="grp">Main reading</div>`+mainR(x).map(r=>rowHTML(r)).join('')}
  if(x.ps.length||x.pr.length){h+=`<div class="grp">Psalms${x.pr.length?' & Proverbs':''}</div>`+ranges(x.ps).map(r=>rowHTML(r,r.ids.includes('PSA.119')?'176 verses · a day to itself':'')).join('')+ranges(x.pr).map(r=>rowHTML(r)).join('')}
  const bl=[...new Set(x.main.map(id=>BLK[id]).filter(b=>b!=null))];
  bl.forEach(bi=>{const first=PLAN.findIndex(d=>d.main.some(id=>BLK[id]===bi)),last=PLAN.length-1-[...PLAN].reverse().findIndex(d=>d.main.some(id=>BLK[id]===bi));
    const tag=first===viewDay?'begins today':last===viewDay?'finishes today':'';
    h+=`<details class="intro"${first===viewDay?' open':''}><summary>${esc(BLOCKS[bi].n)}${tag?`<small>${tag}</small>`:''}</summary><p>${esc(BLOCKS[bi].why)}</p></details>`});
  const dd=dateOf(viewDay),key=dd.getUTCFullYear()+'-'+String(dd.getUTCMonth()+1).padStart(2,'0')+'-'+String(dd.getUTCDate()).padStart(2,'0');
  h+=`<div class="grp">A verse or thought from today</div><textarea id="jtext" data-key="${key}" placeholder="Write down one verse that stood out, or a sentence about what you read."></textarea>`;
  const el=document.getElementById('v-today');el.innerHTML=h;
  el.querySelectorAll('input[data-ind]').forEach(i=>i.indeterminate=true);
  document.getElementById('jtext').value=S.journal[key]||'';
}
function daySummary(x){
  return ranges(x.an).concat(mainR(x),ranges(x.ps),ranges(x.pr)).map(r=>r.short).join(' · ');
}
function renderPlan(){
  const st=status();let h=`<h2 class="sec">The plan</h2><p class="sub">${ND} days, ${ALL.length} chapters, about ${Math.round(ALL.length/ND)} a day, balanced by length. Tap a day to open it.</p>`;
  if(st.t>=0&&st.t<ND){
    h+=`<div class="alert"><p>${st.late?`<span class="chip warn">${st.late} chapters behind</span>`:st.ahead?`<span class="chip ok">${st.ahead} chapters ahead</span>`:`<span class="chip ok">On track</span>`}</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-act="respread">Re-spread from today</button>${S.respreads.length?'<button class="btn ghost" data-act="undo">Undo last re-spread</button>':''}</div></div>`;
  }
  let month='';h+='<div class="plist">';
  PLAN.forEach(x=>{const m=fmt(x.i,{month:'long',year:'numeric'});if(m!==month){month=m;h+=`<h3>${esc(m)}</h3>`}
    const ids=dayIds(x),d=ids.filter(isDone).length,cls=d===ids.length?'full':d?'part':x.i<st.t?'late':'';
    h+=`<button class="pday${x.i===st.t?' today':''}" data-day="${x.i}"><span class="d"><b>${esc(fmt(x.i,{month:'short',day:'numeric'}))}</b>${esc(fmt(x.i,{weekday:'short'}))} · ${x.i+1}</span><span class="s">${x.feast.length?`<em>${esc(x.feast[0].label)}</em> · `:''}${esc(daySummary(x))}</span><span class="dot ${cls}"></span></button>`});
  h+=`</div><div class="tips"><h3 style="font-size:22px;margin:26px 0 6px">Tips</h3><p><b>Put it on your home screen.</b> Open this page's claude.ai link in Safari or Chrome and choose Share, then Add to Home Screen. It opens like an app.</p><p><b>Set a daily alarm</b> for your reading time. A fixed time matters more than anything else.</p><p><b>Reading with others?</b> Share this page from claude.ai. Each person's checkmarks and journal are private to them; they need Contributor access to save progress.</p><p><b>Esther, Daniel and Baruch</b> follow the chapter numbering of Bibles that print the Greek additions as chapters (Esther 11–16, Daniel 13–14, Baruch 6 as the Letter of Jeremiah). Daniel 3 includes the Song of the Three Young Men.</p></div>`;
  document.getElementById('v-plan').innerHTML=h;
}
const COL={OT:'var(--ot)',DC:'var(--lapis)',NT:'var(--gold)'};
function renderShelf(){
  const b=booksDone();
  let h=`<h2 class="sec">Your shelf</h2><p class="sub">${b} of 73 books finished. Each spine fills as you read; tap one for its progress.</p><div class="legend"><span><i style="background:var(--ot)"></i>Old Testament</span><span><i style="background:var(--lapis)"></i>Deuterocanon</span><span><i style="background:var(--gold)"></i>New Testament</span></div>`;
  const shelf=t=>`<div class="shelf">${BOOKS.filter(x=>t?x[3]==='NT':x[3]!=='NT').map(x=>{const ids=chIds(x[0]),d=ids.filter(isDone).length,p=Math.round(d/ids.length*100),ht=Math.round(46+Math.min(110,Math.sqrt(ids.length)*12));
    return `<button class="spine${p===100?' full':''}" data-book="${x[0]}" style="height:${ht}px;--c:${COL[x[3]]};--p:${p}%" aria-label="${esc(x[1])}: ${d} of ${ids.length} chapters"><span>${esc(x[2])}</span></button>`}).join('')}</div>`;
  h+=shelf(0)+shelf(1);
  h+=`<h3 style="font-size:22px;margin:8px 0 4px">Milestones</h3><ul class="ms">`;
  const nt=BOOKS.filter(x=>x[3]==='NT').every(x=>bookDone(x[0])),half=ALL.filter(isDone).length>=ALL.length/2;
  const tick=on=>on?'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="var(--gold)"/><path d="M7 12.5l3.2 3.2L17 9" stroke="#fff" stroke-width="2.6" fill="none"/></svg>':'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="var(--line)" stroke-width="2"/></svg>';
  const list=MILES.map(([n,t])=>[b>=n,t]).concat([[nt,'All 27 New Testament books'],[half,'Halfway: '+Math.ceil(ALL.length/2)+' chapters']]);
  h+=list.map(([on,t])=>`<li class="${on?'':'no'}">${tick(on)}${esc(t)}</li>`).join('')+'</ul>';
  h+=`<p class="sub" style="margin-top:12px">On schedule you'll have finished ${NATIVITY} books by the Feast of the Nativity on January 7.</p>`;
  document.getElementById('v-shelf').innerHTML=h;
}
function renderJournal(){
  const ks=Object.keys(S.journal).filter(k=>S.journal[k]&&S.journal[k].trim()).sort().reverse();
  let h=`<h2 class="sec">Journal</h2><p class="sub">${ks.length} entr${ks.length===1?'y':'ies'}. Add one from any day's page.</p>`;
  if(ks.length)h+=`<button class="btn ghost" data-act="copy">Copy all entries</button>`;
  h+=ks.length?ks.map(k=>{const i=toIdx(k),x=PLAN[i];return `<div class="jent"><div class="d">${esc(i>=0&&i<ND?fmt(i,{weekday:'short',month:'short',day:'numeric'})+' · '+daySummary(x):k)}</div><p>${esc(S.journal[k])}</p></div>`}).join(''):`<p class="empty">Nothing yet. On each day's page there's a box for a verse or a thought.</p>`;
  document.getElementById('v-journal').innerHTML=h;
}
function route(){
  let v=(location.hash||'#today').slice(1);if(!['today','plan','shelf','journal'].includes(v))v='today';
  document.querySelectorAll('.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));
  document.querySelectorAll('.tabs a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));
  header();({today:renderToday,plan:renderPlan,shelf:renderShelf,journal:renderJournal})[v]();
}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)}
function modal(html){const m=document.getElementById('modal');document.getElementById('mbox').innerHTML=html;m.classList.add('on');const b=m.querySelector('button');b&&b.focus()}
function closeModal(){document.getElementById('modal').classList.remove('on')}

let db=null,ref=null,writing=false,again=false,wt;
function save(){S.u=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}clearTimeout(wt);wt=setTimeout(push,700)}
async function push(){if(!ref)return;if(writing){again=true;return}writing=true;
  try{await ref.set(JSON.parse(JSON.stringify(S)));setSync('Saved to your Claude account, so it follows you across devices.')}catch(e){setSync('Saving on this device only right now.')}
  writing=false;if(again){again=false;push()}}
function setSync(m){document.getElementById('sync').textContent=m}

function toggle(ids,on){
  const before=new Set(BOOKS.filter(b=>bookDone(b[0])).map(b=>b[0])),bc=before.size;
  ids.forEach(id=>{if(on)S.done[id]=1;else delete S.done[id]});
  const fin=BOOKS.filter(b=>bookDone(b[0])&&!before.has(b[0])),ac=booksDone();
  save();
  const ms=MILES.find(([n])=>bc<n&&ac>=n&&!S.seen.includes(n));
  if(ms){S.seen.push(ms[0]);save();modal(`<div class="celebrate"><h2>${esc(ms[1])}</h2><p>${ms[0]===73?'You have read the whole Bible, every book, from Advent to Lent. Glory to God.':'You\'ve finished '+ac+' of 73 books'+(fin.length?', most recently '+esc(fin[fin.length-1][1]):'')+'. Keep going.'}</p><div class="acts"><button class="btn" data-act="close">Continue</button></div></div>`)}
  else if(fin.length)toast('Finished '+fin.map(b=>b[1]).join(', ')+' · '+ac+' of 73 books');
  route();
}

document.addEventListener('change',e=>{const i=e.target.closest('input[data-ids]');if(i)toggle(i.dataset.ids.split(' '),i.checked)});
let jt;document.addEventListener('input',e=>{if(e.target.id==='jtext'){S.journal[e.target.dataset.key]=e.target.value;clearTimeout(jt);jt=setTimeout(save,600)}});
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.id==='prev'&&viewDay>0){viewDay--;renderToday();scrollTo(0,0)}
  else if(t.id==='next'&&viewDay<ND-1){viewDay++;renderToday();scrollTo(0,0)}
  else if(t.dataset.day){viewDay=+t.dataset.day;location.hash='today';route();scrollTo(0,0)}
  else if(t.dataset.book){const k=t.dataset.book,ids=chIds(k),d=ids.filter(isDone).length;const nx=PLAN.find(x=>dayIds(x).some(id=>bookOf(id)===k&&!isDone(id)));toast(BK[k].n+': '+d+' of '+ids.length+' chapters'+(d<ids.length&&nx?' · next on '+fmt(nx.i,{month:'short',day:'numeric'}):''))}
  const a=t.dataset.act;if(!a)return;
  if(a==='close')closeModal();
  else if(a==='respread'){const st=status(),f=Math.max(1,st.t),left=ALL.filter(id=>!isDone(id)).length,days=ND-f;
    modal(`<h2>Re-spread the rest?</h2><p>Your ${left} remaining chapters will be spread evenly over the ${days} days from ${esc(fmt(f,{month:'long',day:'numeric'}))} to March 7, about ${Math.round(left/days)} a day. Days already passed stay as they were, and feast-day readings stay on their feasts.</p><div class="acts"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="dorespread">Re-spread</button></div>`)}
  else if(a==='dorespread'){const f=Math.max(1,today());S.respreads.push({from:f,done:Object.keys(S.done)});save();computePlan();closeModal();viewDay=Math.min(ND-1,f);route();toast('Plan re-spread from '+fmt(f,{month:'short',day:'numeric'}))}
  else if(a==='undo'){S.respreads.pop();save();computePlan();route();toast('Last re-spread undone')}
  else if(a==='copy'){const ks=Object.keys(S.journal).filter(k=>S.journal[k].trim()).sort();const txt=ks.map(k=>{const i=toIdx(k);return (i>=0&&i<ND?fmt(i,{weekday:'short',month:'short',day:'numeric'})+' ('+daySummary(PLAN[i])+')':k)+'\n'+S.journal[k]}).join('\n\n');
    navigator.clipboard.writeText(txt).then(()=>toast('Journal copied')).catch(()=>toast('Copy isn\'t available here'))}
});
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
window.addEventListener('hashchange',route);

computePlan();route();

(async()=>{try{
  const cl=window.claude;if(!cl||!cl.use)return;
  const [d,u]=await Promise.all([cl.use('db'),cl.use('user')]);if(!d||!u)return;
  const id=await u.id();if(!id)return;db=d;ref=db.doc('data/users/'+id+'/state');
  const snap=await ref.get();
  if(snap.exists){const r=snap.data()||{};if((r.u||0)>(S.u||0)){S=Object.assign({done:{},journal:{},respreads:[],seen:[],u:0},JSON.parse(JSON.stringify(r)));try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}computePlan();route()}else if((S.u||0)>(r.u||0))push()}
  else if(S.u)push();
  setSync('Saved to your Claude account, so it follows you across devices.');
  ref.onSnapshot(s=>{if(!s.exists||s.metadata.hasPendingWrites)return;const r=s.data()||{};if((r.u||0)>(S.u||0)){S=Object.assign({done:{},journal:{},respreads:[],seen:[],u:0},JSON.parse(JSON.stringify(r)));try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}computePlan();if(document.activeElement&&document.activeElement.id==='jtext')header();else route()}},()=>{});
}catch(e){setSync('Saving on this device only right now.')}})();
}
</script>
</body>
</html>
